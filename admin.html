<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Income Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:#166534;color:#fff;padding:18px;border-radius:14px;margin-bottom:14px}.top h1{margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-bottom:14px}.stat b{font-size:24px;display:block;margin-top:5px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700}.green{background:#16a34a;color:#fff}.green:hover{background:#15803d}.gray{background:#e5e7eb}.red{background:#dc2626;color:#fff}.input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 10px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.table{overflow:auto}.item{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:8px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.login{max-width:420px;margin:60px auto}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login panel"><h1>🔐 Ludo Income Admin</h1><p>Admin Login</p><input id="am" class="input" placeholder="Admin Mobile"><input id="ap" class="input" type="password" placeholder="Admin Password"><button class="btn green" onclick="login()">Login</button><p id="lm"></p></div>
<div id="main" class="wrap hide"><div class="top"><h1>🎮 Ludo Income Admin Panel</h1><small>Management Dashboard</small></div>
<div class="grid"><div class="stat">Users<b id="sUsers">0</b></div><div class="stat">Gaming Balance<b>৳<span id="sGaming">0</span></b></div><div class="stat">Winning Balance<b>৳<span id="sWinning">0</span></b></div><div class="stat">Pending<b id="sPending">0</b></div></div>
<div class="tabs">
<button class="btn green" onclick="tab('overview')">Overview</button><button class="btn green" onclick="tab('users')">Users</button><button class="btn green" onclick="tab('deposits')">Deposits</button><button class="btn green" onclick="tab('withdraws')">Withdraws</button><button class="btn green" onclick="tab('matches')">Matches</button><button class="btn green" onclick="tab('winnings')">🎉 My Match</button><button class="btn green" onclick="tab('support')">Support</button><button class="btn green" onclick="tab('ann')">Announcement</button><button class="btn green" onclick="tab('payments')">Deposit Settings</button><button class="btn green" onclick="tab('profileSettings')">Profile Settings</button><button class="btn green" onclick="tab('matchSettings')">🎮 Match Settings</button><button class="btn green" onclick="tab('maintenance')">🔧 Maintenance</button><button class="btn gray" onclick="tab(currentTab)">Refresh</button><button class="btn red" onclick="logout()">Logout</button>
</div>
<div id="content"></div></div>
<script>
const API="/api";let T=localStorage.getItem("li_admin");
async function req(p,o={}){o.headers={...(o.headers||{}),Authorization:"Bearer "+T,"Content-Type":"application/json"};let r=await fetch(API+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"Request failed");return d}
function money(n){return Number(n||0).toLocaleString("en-BD")}
async function login(){try{let d=await fetch(API+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mobile:am.value,password:ap.value})}).then(r=>r.json());if(!d.token)throw Error(d.message||"Login failed");T=d.token;localStorage.setItem("li_admin",T);show();}catch(e){lm.textContent=e.message}}
function show(){document.getElementById("login").classList.add("hide");document.getElementById("main").classList.remove("hide");tab("overview")}
function logout(){localStorage.removeItem("li_admin");location.reload()}
let currentTab="overview";
async function tab(x){currentTab=x;let c=document.getElementById("content");try{
if(x==="overview"){let d=await req("/admin/stats");c.innerHTML="<div class='panel'><h2>Dashboard Overview</h2><p>System is connected and ready.</p></div>";sUsers.textContent=d.users;sGaming.textContent=money(d.gaming_balance);sWinning.textContent=money(d.winning_balance);sPending.textContent=d.pending_requests}
if(x==="users"){let d=await req("/admin/users");c.innerHTML="<div class='panel'><h2>Users</h2><input class='input' id='us' placeholder='Search name/mobile' oninput='users()'><div id='ul'></div></div>";window.users=async()=>{let q=us.value;let z=await req("/admin/users?search="+encodeURIComponent(q));ul.innerHTML=z.users.map(u=>`<div class=item><b>#${u.id} ${esc(u.name)}</b><br>${esc(u.mobile)}<br>Gaming: ৳${money(u.gaming_balance)} | Winning: ৳${money(u.winning_balance)}<br><span>${u.blocked?"🚫 Blocked":"✅ Active"}</span><div class=actions><button class="btn green" onclick="block(${u.id},${!u.blocked})">${u.blocked?"Unblock":"Block"}</button><button class="btn green" onclick="adjust(${u.id})">Adjust Balance</button></div></div>`).join("")};users()}
if(x==="deposits"){let d=await req("/admin/deposits");c.innerHTML="<div class=panel><h2>Deposit Requests</h2>"+d.items.map(t=>`<div class=item>#${t.id} ${esc(t.user)} — ৳${money(t.amount)} — ${esc(t.method||"")} — ${esc(t.transaction_id||"")} — <b>${t.status}</b>${t.status==="pending"?`<div class=actions><button class="btn green" onclick="dec('deposits',${t.id},'approve')">Approve</button><button class="btn red" onclick="dec('deposits',${t.id},'reject')">Reject</button></div>`:""}</div>`).join("")+"</div>"}
if(x==="withdraws"){let d=await req("/admin/withdraws");c.innerHTML="<div class=panel><h2>Withdraw Requests</h2>"+d.items.map(t=>`<div class=item>#${t.id} ${esc(t.user)} — ৳${money(t.amount)} — ${esc(t.number||"")} — <b>${t.status}</b>${t.status==="pending"?`<div class=actions><button class="btn green" onclick="wd(${t.id},'approve')">Approve</button><button class="btn red" onclick="wd(${t.id},'reject')">Reject + Refund</button></div>`:""}</div>`).join("")+"</div>"}
if(x==="matches"){let d=await req("/admin/matches");c.innerHTML=`<div class=panel><h2>Create Match</h2><div class=row><input id=mt class=input placeholder=Title><input id=me class=input type=number placeholder="Entry Fee"><input id=mp class=input type=number placeholder=Prize><input id=mm class=input type=number placeholder="Max Players (2 recommended)" value="2"><input id=mtime class=input placeholder="Time"><input id=mr class=input placeholder="Room Code (Admin sets this)"></div><button class="btn green" onclick="createMatch()">Create Match</button></div><div class=panel><h2>Matches</h2>${d.matches.map(m=>`<div class=item>#${m.id} <b>${esc(m.title)}</b> — ৳${money(m.entry_fee)} / Prize ৳${money(m.prize)} — ${m.players}/2 — ${esc(m.status)} — Room: ${esc(m.room_id||"-")}<br>${m.player_details?.length?`Players: ${m.player_details.map(u=>`${esc(u.name)} | ${esc(u.uid_code)} | ${esc(u.mobile)} <button class="btn green" onclick="userProfile(${u.user_id})">User Prof✅</button>`).join("<br>")}`:"No players"}<div class=actions><button class="btn green" onclick="editMatch(${m.id})">Edit / Room Code</button><button class="btn red" onclick="delMatch(${m.id})">Delete</button></div></div>`).join("")}</div>`}
if(x==="winnings"){let d=await req("/admin/winnings");c.innerHTML="<div class=panel><h2>🎉 My Match — Screenshot Submissions</h2><p>Winner screenshot submit করলে এখানে User Profile, UID, Mobile, Match এবং screenshot দেখা যাবে।</p>"+d.items.map(w=>`<div class=item><b>User Profile</b><br>👨‍🦱 ${esc(w.user_profile?.name||"-")}<br>UID: ${esc(w.user_profile?.uid_code||"-")}<br>Mobile: ${esc(w.user_profile?.mobile||"-")}<br>🎮 Match: ${esc(w.match_title||"-")} (#${w.match_id})<br>Prize: ৳${money(w.prize)}<br>Status: <b>${esc(w.status)}</b><br>${w.screenshot?`<a href="${esc(w.screenshot)}" target="_blank">📸 View Screenshot</a>`:""}<div class=actions><button class="btn green" onclick="userProfile(${w.user_profile?.id||0})">User Prof✅</button>${w.status==="pending"?`<button class="btn green" onclick="win(${w.id},'approve')">Approve & Credit Prize</button><button class="btn red" onclick="win(${w.id},'reject')">Reject</button>`:""}</div></div>`).join("")+"</div>"}
if(x==="support"){let d=await req("/admin/support");c.innerHTML="<div class=panel><h2>Support Messages</h2>"+d.items.map(s=>`<div class=item>#${s.id} ${esc(s.user)}<p>${esc(s.message)}</p><textarea id="r${s.id}" class=input placeholder="Reply">${esc(s.reply||"")}</textarea><button class="btn green" onclick="reply(${s.id})">Save Reply</button></div>`).join("")+"</div>"}
if(x==="matchSettings"){let d=await req("/admin/match-settings"),s=d.match_settings||{};c.innerHTML=`<div class=panel><h2>🎮 Match / My Match Settings</h2><p>সবকিছু এখান থেকে কাস্টমাইজ করতে পারবেন।</p><label>Players needed to auto-close Match</label><input id=mclose class=input type=number min=2 value="${Number(s.players_to_close||2)}"><label><input id=roomshow type=checkbox ${s.show_room_after_full!==false?'checked':''}> ২ জন Join হওয়ার পর joined players-কে Room Code দেখাবে</label><label><input id=oneshot type=checkbox ${s.one_screenshot_per_match!==false?'checked':''}> একই User একই Match-এ Screenshot একবারই submit করতে পারবে</label><label>My Match Label</label><input id=mylbl class=input value="${esc(s.my_match_label||'🎉 My Match 🎉')}"><label>Screenshot Upload Label</label><input id=uploadlbl class=input value="${esc(s.upload_label||'📸 Upload Winning Screenshot')}"><label>Success Message</label><input id=successmsg class=input value="${esc(s.success_message||'Screenshot submitted successfully!')}"><button class="btn green" onclick="saveMatchSettings()">Save Match Settings</button></div>`}
if(x==="maintenance"){let d=await req("/admin/maintenance"),s=d.maintenance||{};c.innerHTML=`<div class=panel><h2>🔧 Maintenance / Update Mode</h2><p>ON করলে সাধারণ User Website/App-এ ঢুকতে পারবে না। শুধু এই Admin Panel এবং Admin API চালু থাকবে।</p><label><input id=menabled type=checkbox ${s.enabled?'checked':''}> 🔴 Maintenance Mode ON</label><label>Title</label><input id=metitle class=input value="${esc(s.title||'🔧 Update চলছে')}"><label>Main Message</label><textarea id=memsg class=input rows=5>${esc(s.message||'আমাদের Ludo Income App বর্তমানে আপডেট করা হচ্ছে। Update শেষ হলে আবার প্রবেশ করতে পারবেন।')}</textarea><label>Thank-you Footer</label><input id=mefoot class=input value="${esc(s.footer||'এতক্ষণ আমাদের সাথে থাকার জন্য ধন্যবাদ ❤️')}"><label>Retry Button Text</label><input id=mebtn class=input value="${esc(s.button_text||'🔄 আবার চেষ্টা করুন')}"><button class="btn green" onclick="saveMaintenance()">Save Maintenance Settings</button><p><b>Admin:</b> Maintenance ON থাকা অবস্থাতেও <code>/admin</code> কাজ করবে।</p></div>`}if(x==="profileSettings"){let d=await req("/admin/profile-settings"),s=d.profile_settings;c.innerHTML=`<div class=panel><h2>👤 Profile & Statement Settings</h2><p>এখান থেকে User Profile-এর UID, logo, field show/hide এবং My Statement-এর নাম কাস্টমাইজ করতে পারবেন।</p><div class=row><div><label>UID Prefix</label><input id=uidp class=input value="${esc(s.uid_prefix||"LI")}"><label>Profile Logo / Emoji / Image URL</label><input id=plogo class=input value="${esc(s.profile_logo||"👨‍🦱")}"><div><label><input id=psname type=checkbox ${s.show_name!==false?'checked':''}> Show Name</label></div><div><label><input id=psmobile type=checkbox ${s.show_mobile!==false?'checked':''}> Show Mobile</label></div><div><label><input id=psuid type=checkbox ${s.show_uid!==false?'checked':''}> Show UID</label></div></div><div><label>UID Label</label><input id=uidl class=input value="${esc(s.uid_label||"UID Code")}"><label>Mobile Label</label><input id=mlabel class=input value="${esc(s.mobile_label||"Mobile Number")}"><label>Matches Label</label><input id=matchlabel class=input value="${esc(s.matches_label||"🎮 Matches")}"><label>Statement Label</label><input id=stlabel class=input value="${esc(s.statement_label||"📒 My Statement")}"><div><label><input id=psmatches type=checkbox ${s.show_matches!==false?'checked':''}> Show Matches Count</label></div><div><label><input id=psref type=checkbox ${s.show_referral!==false?'checked':''}> Show Referral</label></div></div></div><button class="btn green" onclick="saveProfileSettings()">Save Profile Settings</button></div>`}if(x==="ann"){let d=await req("/admin/announcements");c.innerHTML="<div class=panel><h2>Announcement</h2><textarea id=at class=input placeholder='Announcement text'></textarea><button class='btn green' onclick='addAnn()'>Create</button></div><div class=panel>"+d.items.map(a=>`<div class=item>#${a.id} ${esc(a.text)} — ${a.enabled?"Enabled":"Disabled"} <div class=actions><button class="btn green" onclick="toggleAnn(${a.id})">${a.enabled?"Disable":"Enable"}</button><button class="btn red" onclick="delAnn(${a.id})">Delete</button></div></div>`).join("")+"</div>"}
if(x==="payments"){let d=await req("/admin/payment-settings"),s=d.payment_settings;c.innerHTML=`<div class=panel><h2>💳 Deposit Settings</h2><p>এখান থেকে User Deposit page-এর payment number, label, minimum amount, logo URL এবং instructions পরিবর্তন করতে পারবেন।</p><div class=row><div><h3>bKash</h3><input id=pb class=input placeholder="bKash number" value="${esc(s.bkash.number)}"><input id=pbl class=input placeholder="Label" value="${esc(s.bkash.label||'Personal')}"><input id=pblogo class=input placeholder="Logo URL (optional)" value="${esc(s.bkash.logo_url||'')}"><label><input id=pbe type=checkbox ${s.bkash.enabled!==false?'checked':''}> Enabled</label></div><div><h3>Nagad</h3><input id=pn class=input placeholder="Nagad number" value="${esc(s.nagad.number)}"><input id=pnl class=input placeholder="Label" value="${esc(s.nagad.label||'Personal')}"><input id=pnlogo class=input placeholder="Logo URL (optional)" value="${esc(s.nagad.logo_url||'')}"><label><input id=pne type=checkbox ${s.nagad.enabled!==false?'checked':''}> Enabled</label></div></div><label>Minimum Deposit</label><input id=pmin class=input type=number min=1 value="${Number(s.min_deposit||10)}"><label>Deposit Instructions (one line per instruction)</label><textarea id=pins class=input rows=8>${esc((s.instructions||[]).join("\n"))}</textarea><button class="btn green" onclick="savePayments()">Save Deposit Settings</button></div>`}
}catch(e){c.innerHTML="<div class=panel>"+esc(e.message)+"</div>"}}
async function block(id,b){if(!confirm((b?"Block":"Unblock")+" this user?"))return;await req("/admin/users/"+id+"/block",{method:"POST",body:JSON.stringify({blocked:b})});tab("users")}
async function adjust(id){let g=prompt("Gaming balance change (+/-):","0"),w=prompt("Winning balance change (+/-):","0");if(g===null)return;await req("/admin/users/"+id+"/balance",{method:"POST",body:JSON.stringify({gaming_delta:Number(g),winning_delta:Number(w||0)})});tab("users")}
async function dec(t,id,a){if(!confirm((a==="approve"?"Approve":"Reject")+" this "+t+" request?"))return;await req("/admin/"+t+"/"+id+"/"+a,{method:"POST"});tab(t)}
async function wd(id,a){if(!confirm(a==="approve"?"Approve this withdrawal?":"Reject and refund this withdrawal?"))return;await req("/admin/withdraws/"+id+"/"+a,{method:"POST"});tab("withdraws")}
async function createMatch(){await req("/admin/matches",{method:"POST",body:JSON.stringify({title:mt.value,entry_fee:me.value,prize:mp.value,max_players:mm.value,time:mtime.value,room_id:mr.value,status:"upcoming"})});tab("matches")}
async function delMatch(id){if(confirm("Delete match? This also removes its player entries.")){await req("/admin/matches/"+id,{method:"DELETE"});tab("matches")}}
async function editMatch(id){let status=prompt("Status: upcoming/live/completed","upcoming"),room=prompt("Room ID","");await req("/admin/matches/"+id,{method:"PUT",body:JSON.stringify({status,room_id:room})});tab("matches")}
async function userProfile(id){if(!id)return;try{let d=await req("/admin/users/"+id+"/profile"),u=d.user,b=d.balance;let ms=d.matches||[];alert("👨‍🦱 User Profile\n\nName: "+u.name+"\nUID: "+u.uid_code+"\nMobile: "+u.mobile+"\nReferral: "+u.referral_code+"\nGaming: ৳"+money(b.gaming_balance)+"\nWinning: ৳"+money(b.winning_balance)+"\n\n🎮 Matches: "+ms.length);}catch(e){alert(e.message)}}
async function win(id,a){if(!confirm(a==="approve"?"Approve this winning and credit the match prize?":"Reject this winning?"))return;await req("/admin/winnings/"+id+"/"+a,{method:"POST"});tab("winnings")}
async function reply(id){await req("/admin/support/"+id+"/reply",{method:"POST",body:JSON.stringify({reply:document.getElementById("r"+id).value})});tab("support")}
async function addAnn(){if(!at.value.trim())return;await req("/admin/announcements",{method:"POST",body:JSON.stringify({text:at.value})});tab("ann")}
async function toggleAnn(id){await req("/admin/announcements/"+id+"/toggle",{method:"POST"});tab("ann")}
async function delAnn(id){await req("/admin/announcements/"+id,{method:"DELETE"});tab("ann")}
async function savePayments(){
 const instructions=pins.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 await req("/admin/payment-settings",{method:"PUT",body:JSON.stringify({
  bkash:{number:pb.value,label:pbl.value,logo_url:pblogo.value,enabled:pbe.checked},
  nagad:{number:pn.value,label:pnl.value,logo_url:pnlogo.value,enabled:pne.checked},
  min_deposit:Number(pmin.value),instructions
 })});alert("Deposit settings saved");tab("payments");
}
async function saveMatchSettings(){await req("/admin/match-settings",{method:"PUT",body:JSON.stringify({players_to_close:Number(mclose.value),show_room_after_full:roomshow.checked,one_screenshot_per_match:oneshot.checked,my_match_label:mylbl.value,upload_label:uploadlbl.value,success_message:successmsg.value})});alert("Match settings saved");tab("matchSettings");}
async function saveMaintenance(){await req("/admin/maintenance",{method:"PUT",body:JSON.stringify({enabled:menabled.checked,title:metitle.value,message:memsg.value,footer:mefoot.value,button_text:mebtn.value})});alert(menabled.checked?"Maintenance Mode ON":"Maintenance Mode OFF");tab("maintenance");}
async function saveProfileSettings(){
 await req("/admin/profile-settings",{method:"PUT",body:JSON.stringify({uid_prefix:uidp.value,profile_logo:plogo.value,uid_label:uidl.value,mobile_label:mlabel.value,matches_label:matchlabel.value,statement_label:stlabel.value,show_name:psname.checked,show_mobile:psmobile.checked,show_uid:psuid.checked,show_matches:psmatches.checked,show_referral:psref.checked})});alert("Profile settings saved");tab("profileSettings");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}
if(T)show();
</script></body></html>
